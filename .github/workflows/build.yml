name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements.txt
      - name: Offline tests
        run: python tests/test_engines.py
      - name: Windows tests (OCR, hotkeys, online translation)
        run: python tests/ci_windows_test.py
      - name: Smoke-test imports
        run: python -c "import translator, tray; tray.make_icon()"
      - run: pyinstaller --onefile --windowed --name EasyTranslator --hidden-import pystray._win32 translator.py
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTranslator
          path: dist/EasyTranslator.exe
