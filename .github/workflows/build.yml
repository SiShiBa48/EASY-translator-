name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements.txt
      - name: Offline tests
        run: python tests/test_engines.py
      - name: Windows tests (OCR, hotkeys, online translation)
        run: python tests/ci_windows_test.py
      - name: Smoke-test imports
        run: python -c "import translator, tray; tray.make_icon()"
      - name: Chinese OCR accuracy (informational)
        continue-on-error: true
        run: |
          Add-WindowsCapability -Online -Name "Language.OCR~~~zh-CN~0.0.1.0" | Out-Null
          python tests/ci_zh_ocr.py
      - run: pyinstaller --onefile --windowed --name EasyTranslator --hidden-import pystray._win32 translator.py
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTranslator
          path: dist/EasyTranslator.exe
