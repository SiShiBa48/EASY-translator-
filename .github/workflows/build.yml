name: Build Windows exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller -r requirements.txt
      - name: Test OCR
        run: python tests/ci_ocr_test.py
      - name: Smoke-test imports
        run: python -c "import translator, hotkey, ocr"
      - name: Try registering a hotkey (informational)
        continue-on-error: true
        run: python -c "import hotkey; h=hotkey.GlobalHotkey(); print('registered:', h.register(hotkey.MOD_CONTROL|hotkey.MOD_ALT, 0x51, lambda:None)); h.unregister()"
      - run: pyinstaller --onefile --windowed --name EasyTranslator translator.py
      - uses: actions/upload-artifact@v4
        with:
          name: EasyTranslator
          path: dist/EasyTranslator.exe
